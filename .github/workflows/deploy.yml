# Publica la tienda en GitHub Pages en cada push a main.
# Requisito: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validar datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar products.json
        run: node -e "const p=JSON.parse(require('fs').readFileSync('data/products.json','utf8')); if(!Array.isArray(p)||!p.length) throw new Error('Catálogo vacío o inválido'); const ids=new Set(p.map(x=>x.id)); if(ids.size!==p.length) throw new Error('IDs de producto duplicados'); console.log(p.length+' productos OK')"
      - name: Revisar sintaxis de los módulos JS
        run: for f in $(find js config -name '*.js'); do node --check "$f"; done

  deploy:
    name: Publicar
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio (solo archivos públicos)
        run: |
          mkdir _site
          cp -r index.html assets config css data js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
